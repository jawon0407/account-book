name: security-gate

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: security-gate-${{ github.event_name }}-${{ github.event_name == 'push' && github.run_id || github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security-gate:
    name: security-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17@sha256:cb875afe6d2e8593c28c22d37d0fd7aaf035c43a42e2f7792cd4c09ceb6beac5
        env:
          POSTGRES_DB: account_book_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d account_book_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out the exact commit without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use the repository-pinned Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          check-latest: false

      - name: Enable the repository package manager
        run: corepack enable

      - name: Install the reviewed dependency graph
        run: pnpm install --frozen-lockfile

      - name: Run repository verification
        run: pnpm run verify

      - name: Test the disposable authentication schema
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/account_book_test
          TEST_DATABASE_DISPOSABLE: 'true'
        run: pnpm test:db

      - name: Prepare the disposable database for browser authentication
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/account_book_test
          TEST_DATABASE_DISPOSABLE: 'true'
        run: pnpm --filter @account-book/database-tests prepare:e2e

      - name: Install the pinned Chromium runtime
        run: pnpm --filter @account-book/e2e exec playwright install --with-deps chromium

      - name: Test browser authentication through the real BFF and API
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/account_book_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/account_book_test
          TEST_DATABASE_DISPOSABLE: 'true'
        run: pnpm --filter @account-book/e2e test

      - name: Reject high-severity production dependency advisories
        run: pnpm audit --prod --audit-level high

      - name: Evaluate pushed or proposed commit range
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_REF: ${{ github.event_name == 'pull_request' && format('refs/heads/{0}', github.base_ref) || github.ref }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: >-
          node scripts/security-gate.mjs
          --mode ci
          --event "$EVENT_NAME"
          --target-ref "$TARGET_REF"
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
